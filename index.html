<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- STYLE: Golden Gate fog at sunrise (soft blues and coral, foghorn) | WHY: He just moved to San Francisco for a job at Tasklet | ALT: Startup office whiteboard, rejected as work-flavored -->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Fog Lifts</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="The Fog Lifts, for BrenBren">
<meta property="og:image" content="https://gordonusc.github.io/gift-brennan/img/bridge.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap">
<style>
:root{--orange:#ff5a1f;--fog:#e9edf2;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b2330;color:#fff;font:16px/1.4 "Space Grotesk",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
.stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100svh*9/16));overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity 1.6s}
canvas.gone{opacity:0;pointer-events:none}
.top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 24px);text-align:center;padding:0 18px;pointer-events:none;color:#26313f;transition:color 1.2s}
.top.clear{color:#fff;text-shadow:0 2px 16px #0009}
.top small{font-weight:700;font-size:12px;letter-spacing:.32em;color:var(--orange)}
.top h1{font-weight:700;font-size:clamp(34px,10.5vw,54px);line-height:1;margin:8px 0 6px;letter-spacing:-.01em}
.top p{margin:0;font-size:15px}
.start{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16%)}
.start button{font:700 16px "Space Grotesk",sans-serif;letter-spacing:.14em;padding:14px 24px;border-radius:999px;border:0;background:var(--orange);color:#fff;box-shadow:0 8px 24px #ff5a1f66;cursor:pointer}
.meter{position:absolute;left:18%;right:18%;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);height:6px;border-radius:3px;background:#26313f33;overflow:hidden;transition:opacity .8s}
.meter b{display:block;height:100%;width:0;background:var(--orange)}
.end{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 9%);text-align:center;padding:0 22px;opacity:0;transform:translateY(12px);transition:all 1.2s;pointer-events:none}
.end.show{opacity:1;transform:none;pointer-events:auto}
.end h2{font-weight:700;font-size:clamp(30px,9vw,46px);line-height:1.05;margin:0;text-shadow:0 2px 20px #000a}
.end p{font-size:18px;margin:10px auto 0;max-width:26ch;text-shadow:0 2px 14px #000c}
.btn{margin-top:16px;font:700 13px "Space Grotesk",sans-serif;letter-spacing:.2em;padding:10px 18px;border-radius:999px;border:2px solid #fff;background:#0004;color:#fff;cursor:pointer}
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font-size:11.5px;color:#ffffffcc;pointer-events:none;text-shadow:0 1px 6px #000}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg" src="img/bridge.jpg" alt="The Golden Gate Bridge at sunrise">
  <canvas id="fog"></canvas>
  <div class="top" id="top"><small>FOR BRENBREN</small><h1>The Fog Lifts</h1><p>Wipe the fog away with your finger.</p></div>
  <div class="meter" id="meter"><b id="bar"></b></div>
  <div class="start" id="start"><button id="go">CLEAR THE FOG</button></div>
  <div class="end" id="end"><h2>New city.<br>New chapter.</h2><p>BrenBren, San Francisco looks good on you. Your dad is so proud of you.</p><button class="btn" id="again">FOG IT AGAIN</button></div>
  <div class="foot">made by Darby, Gordon's AI assistant, with love from Gordon</div>
</div>
<script>
window.SNDS=['foghorn','bay','wipe','reveal'];
// ElevenLabs sound design; code only plays and mixes the files
let ac=null, master=null, bufs={};
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination); (window.SNDS||[]).forEach(load);}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
async function load(n){ if(bufs[n]) return bufs[n]; try{ const r=await fetch('snd/'+n+'.mp3'); const a=await r.arrayBuffer(); bufs[n]=await new Promise((ok,no)=>ac.decodeAudioData(a,ok,no)); }catch(e){} return bufs[n]; }
async function play(n,vol=1,loop=false,rate=1){ if(!audio()) return null; const b=await load(n); if(!b) return null; const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; s.loop=loop; s.playbackRate.value=rate; g.gain.value=vol; s.connect(g).connect(master); s.start(); return {s,g}; }
function fade(h,t=.5){ if(!h||!ac) return; try{ h.g.gain.setTargetAtTime(0,ac.currentTime,t/3); setTimeout(()=>{try{h.s.stop();}catch(e){}},t*1000+300);}catch(e){} }

const cv=document.getElementById('fog'), g=cv.getContext('2d'), DPR=Math.min(devicePixelRatio||1,2);
let bay=null, active=false, cleared=false, lastWipe=0, lastCheck=0;
function paintFog(){ cv.width=cv.clientWidth*DPR; cv.height=cv.clientHeight*DPR; const W=cv.width,H=cv.height; g.globalCompositeOperation='source-over';
  const base=g.createLinearGradient(0,0,0,H); base.addColorStop(0,'#f3f5f8'); base.addColorStop(1,'#d9dfe6'); g.fillStyle=base; g.fillRect(0,0,W,H);
  for(let i=0;i<140;i++){ const x=Math.random()*W,y=Math.random()*H,r=(40+Math.random()*140)*DPR; const gr=g.createRadialGradient(x,y,0,x,y,r); const v=225+Math.random()*30|0; gr.addColorStop(0,`rgba(${v},${v+2},${v+6},.35)`); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); } }
paintFog(); addEventListener('resize',()=>{ if(!cleared) paintFog(); });
document.getElementById('go').onclick=async()=>{ audio(); document.getElementById('start').style.display='none'; active=true; play('foghorn',.9); bay=await play('bay',.55,true); };
function wipe(x,y){ g.globalCompositeOperation='destination-out'; const r=46*DPR; const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,'rgba(0,0,0,.9)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  const now=performance.now(); if(now-lastWipe>260){ lastWipe=now; play('wipe',.45,false,.9+Math.random()*.2); } if(now-lastCheck>300){ lastCheck=now; check(); } }
let down=false, px=0, py=0;
cv.addEventListener('pointerdown',e=>{ if(!active) return; down=true; cv.setPointerCapture(e.pointerId); px=e.offsetX*DPR; py=e.offsetY*DPR; wipe(px,py); });
cv.addEventListener('pointermove',e=>{ if(!down||!active) return; const x=e.offsetX*DPR,y=e.offsetY*DPR, d=Math.hypot(x-px,y-py), n=Math.max(1,Math.ceil(d/(12*DPR))); for(let i=1;i<=n;i++) wipe(px+(x-px)*i/n,py+(y-py)*i/n); px=x; py=y; });
cv.addEventListener('pointerup',()=>down=false);
function check(){ const W=cv.width,H=cv.height, s=24, d=g.getImageData(0,0,W,H).data; let clear=0,tot=0; for(let y=0;y<H;y+=s) for(let x=0;x<W;x+=s){ tot++; if(d[(y*W+x)*4+3]<90) clear++; } const f=clear/tot; document.getElementById('bar').style.width=Math.min(100,f/.6*100)+'%'; if(f>.6&&!cleared) reveal(); }
function reveal(){ cleared=true; active=false; cv.classList.add('gone'); play('reveal',.95); document.getElementById('top').classList.add('clear'); document.getElementById('meter').style.opacity=0; setTimeout(()=>document.getElementById('end').classList.add('show'),900); }
document.getElementById('again').onclick=()=>{ document.getElementById('end').classList.remove('show'); document.getElementById('top').classList.remove('clear'); document.getElementById('meter').style.opacity=1; document.getElementById('bar').style.width='0'; cleared=false; paintFog(); cv.classList.remove('gone'); active=true; play('foghorn',.7); };
</script>
</body>
</html>
